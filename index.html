<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Repeated Recipe</title>
  </head>
  <body>
    <form action="" method="post">
      <div class="form-area">
        <label for="ingredient">材料名</label>
        <input type="text" class="ingredient" />
      </div>
      <div class="form-area">
        <label for="category">カテゴリー名</label>
        <select id="category">
          <option value="">選択してください</option>
          <option value="main-dish">主菜</option>
          <option value="side-dish">副菜</option>
          <option value="staple-food">主食</option>
          <option value="soup">汁物</option>
          <option value="dessert">デザート</option>
          <option value="drink">飲み物</option>
          <option value="bento">弁当</option>
        </select>
      </div>

      <div class="form-area">
        <label for="cuisine">ジャンル</label>
        <select id="cuisine">
          <option value="">選択してください</option>
          <option value="japanese">和食</option>
          <option value="yoshoku">洋食</option>
          <option value="chinese">中華</option>
          <option value="french">フレンチ</option>
          <option value="italian">イタリアン</option>
          <option value="mexican">メキシコ料理</option>
          <option value="thai">タイ料理</option>
          <option value="vietnamese">ベトナム料理</option>
          <option value="indian">インド料理</option>
        </select>
      </div>

      <input type="button" class="search-recipe" value="レシピ検索" />
    </form>
    <div class="result_recipe"></div>
    <script src="main.js" defer></script>
  </body>
</html>
